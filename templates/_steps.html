<nav aria-label="Progress" class="steps-nav">
<ol class="steps">
  {% for n, label in [(1, 'Upload files'), (2, 'Remediate'), (3, 'Review & download')] %}
  <li class="{{ 'on' if n == step else ('done' if n < step else '') }}"{% if n == step %} aria-current="step"{% endif %}>
    <span class="n" aria-hidden="true">{% if n < step %}&#10003;{% else %}{{ n }}{% endif %}</span>
    {{ label }}{% if n < step %}<span class="visually-hidden"> (done)</span>{% endif %}
  </li>
  {% endfor %}
</ol>
</nav>
